<!-- ADVANCED MULTILINGUAL EXAM PORTAL FOR BLOGGER -->
<div id="blogger-exam-portal">
    
    <!-- Load Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Scoped CSS to prevent conflicts with Blogger themes */
        #blogger-exam-portal {
            --ep-primary: #2b5876;
            --ep-secondary: #4e4376;
            --ep-success: #28a745;
            --ep-danger: #dc3545;
            --ep-warning: #ffc107;
            --ep-review: #9c27b0; 
            --ep-current: #17a2b8; 
            --ep-bg: #eef2f3;
            --ep-card-bg: #ffffff;
            --ep-text: #333333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ep-text);
            background-color: var(--ep-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            line-height: 1.6;
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
        }
        #blogger-exam-portal * { box-sizing: border-box; }
        
        #blogger-exam-portal h1, #blogger-exam-portal h2, #blogger-exam-portal h3 { 
            text-align: center; color: var(--ep-primary); margin-top: 0;
        }
        
        /* Buttons */
        #blogger-exam-portal .ep-btn { 
            padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; 
            border-radius: 6px; cursor: pointer; transition: 0.3s; margin: 5px; 
            display: inline-block; text-align: center; text-decoration: none;
        }
        #blogger-exam-portal .ep-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
        #blogger-exam-portal .ep-btn-start { background-color: var(--ep-success); color: white; }
        #blogger-exam-portal .ep-btn-close { background-color: var(--ep-danger); color: white; }
        #blogger-exam-portal .ep-btn-primary { background: linear-gradient(to right, var(--ep-primary), var(--ep-secondary)); color: white; }
        #blogger-exam-portal .ep-btn-review { background-color: var(--ep-review); color: white; }
        #blogger-exam-portal .ep-btn-outline { background-color: transparent; border: 2px solid var(--ep-primary); color: var(--ep-primary); }
        
        /* Screens */
        #blogger-exam-portal .ep-screen { display: none; background: var(--ep-card-bg); padding: 20px; border-radius: 8px; }
        #blogger-exam-portal .ep-active { display: block; animation: epFadeIn 0.5s; }
        @keyframes epFadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Forms */
        #blogger-exam-portal .ep-form-group { margin-bottom: 15px; }
        #blogger-exam-portal .ep-form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: var(--ep-primary); }
        #blogger-exam-portal .ep-form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        #blogger-exam-portal .ep-setup-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media(min-width: 600px) { #blogger-exam-portal .ep-setup-grid { grid-template-columns: 1fr 1fr; } }

        /* Tables */
        #blogger-exam-portal .ep-match-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
        #blogger-exam-portal .ep-match-table th, #blogger-exam-portal .ep-match-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #blogger-exam-portal .ep-match-table th { background-color: #f4f7f6; }

        /* Exam Layout */
        #blogger-exam-portal .ep-exam-layout { display: flex; flex-direction: column; gap: 20px; margin-top: 15px; }
        @media(min-width: 768px) { #blogger-exam-portal .ep-exam-layout { flex-direction: row; } }
        #blogger-exam-portal .ep-left-panel { flex: 7; position: relative; display: flex; flex-direction: column; justify-content: space-between;}
        #blogger-exam-portal .ep-right-panel { flex: 3; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px solid #ddd; height: fit-content; }
        
        #blogger-exam-portal .ep-timer-bar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid #eee; font-size: 16px; font-weight: bold; }
        #blogger-exam-portal .ep-timer-text { color: var(--ep-danger); }
        
        #blogger-exam-portal .ep-toolbar { background: #eef2f3; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid #ccc; flex-wrap: wrap;}
        #blogger-exam-portal .ep-lang-select { padding: 6px; font-size: 14px; border-radius: 4px; border: 1px solid #999; font-weight: bold;}
        
        #blogger-exam-portal .ep-question-area { min-height: 300px; font-size: 16px; }
        #blogger-exam-portal .ep-options label { display: block; background: #fff; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        #blogger-exam-portal .ep-options label:hover { background: #eef2f3; }
        #blogger-exam-portal .ep-options input { margin-right: 10px; transform: scale(1.2); }
        
        #blogger-exam-portal .ep-controls { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; flex-wrap: wrap; gap: 10px;}
        
        /* Submit button on bottom left logic */
        #blogger-exam-portal .ep-submit-wrapper { display: flex; justify-content: flex-start; margin-top: 15px; }

        /* Palette */
        #blogger-exam-portal .ep-palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        #blogger-exam-portal .ep-palette-btn { padding: 10px 0; font-size: 14px; font-weight: bold; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; text-align: center; transition: 0.2s;}
        #blogger-exam-portal .ep-status-unvisited { background: white; color: black; }
        #blogger-exam-portal .ep-status-visited { background: var(--ep-danger); color: white; border-color: var(--ep-danger); }
        #blogger-exam-portal .ep-status-answered { background: var(--ep-success); color: white; border-color: var(--ep-success); }
        #blogger-exam-portal .ep-status-review { background: var(--ep-review); color: white; border-color: var(--ep-review); }
        #blogger-exam-portal .ep-status-current { background: var(--ep-current); color: white; border-color: var(--ep-current); box-shadow: 0 0 5px rgba(23,162,184,0.6); }

        /* Previews & Results */
        #blogger-exam-portal .ep-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; margin-bottom: 20px; }
        #blogger-exam-portal .ep-preview-item { padding: 10px; text-align: center; border: 1px solid #ddd; border-radius: 5px; background: #fafafa; font-size: 13px;}
        
        #blogger-exam-portal .ep-dashboard-layout { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        @media(min-width: 600px) { #blogger-exam-portal .ep-dashboard-layout { flex-direction: row; } }
        #blogger-exam-portal .ep-chart-container { flex: 1; max-width: 250px; margin: 0 auto; }
        #blogger-exam-portal .ep-score-details { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        #blogger-exam-portal .ep-score-box { padding: 10px; border-radius: 6px; margin-bottom: 8px; font-weight: bold; font-size: 15px;}
        
        #blogger-exam-portal .ep-result-item { margin-top: 15px; padding: 15px; border-radius: 6px; background: #fff; border: 1px solid #ddd;}
        
        /* Loader */
        #blogger-exam-portal .ep-loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 0; }
        #blogger-exam-portal .ep-spinner { border: 6px solid #f3f3f3; border-top: 6px solid var(--ep-primary); border-radius: 50%; width: 50px; height: 50px; animation: epSpin 1s linear infinite; margin-bottom: 15px; }
        @keyframes epSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <!-- 1. MAIN DASHBOARD -->
    <div id="ep-home-screen" class="ep-screen ep-active">
        <h1>Examination Portal</h1>
        <form id="ep-exam-config" onsubmit="event.preventDefault(); epGoToInstructions();">
            <div class="ep-setup-grid">
                <div class="ep-form-group">
                    <label>Select Class</label>
                    <select class="ep-form-control" id="ep-class" required>
                        <option value="">-- Choose --</option>
                        <option value="9">Class 9th</option>
                        <option value="10">Class 10th</option>
                    </select>
                </div>
                <div class="ep-form-group">
                    <label>Select Subject</label>
                    <select class="ep-form-control" id="ep-subject" required>
                        <option value="">-- Choose --</option>
                        <option value="Biology">Biology</option>
                        <option value="Physics">Physics</option>
                        <option value="Chemistry">Chemistry</option>
                        <option value="Mathematics">Mathematics</option>
                    </select>
                </div>
                <div class="ep-form-group">
                    <label>Chapter Name</label>
                    <input type="text" class="ep-form-control" id="ep-chapter" value="The Fundamental Unit of Life" required>
                </div>
                <div class="ep-form-group">
                    <label>Difficulty</label>
                    <select class="ep-form-control" id="ep-diff" required>
                        <option value="Normal" selected>Normal</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button type="submit" class="ep-btn ep-btn-primary">Proceed to Setup →</button>
            </div>
        </form>
    </div>

    <!-- 2. INSTRUCTIONS -->
    <div id="ep-instruction-screen" class="ep-screen">
        <h2 id="ep-disp-subject">Subject</h2>
        <h3 id="ep-disp-chapter">Chapter</h3>
        <div style="background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #ddd; margin: 15px 0;">
            <ul style="font-size: 15px; line-height: 1.8; margin:0; padding-left: 20px;">
                <li><strong>Class:</strong> <span id="ep-disp-class"></span></li>
                <li><strong>Questions:</strong> 20 (Mixed Types)</li>
                <li><strong>Time:</strong> 25 Minutes</li>
                <li><strong>Languages:</strong> English, Hindi, Odia (Change during exam)</li>
                <li style="color: red; font-weight: bold;">DO NOT refresh the page during the exam.</li>
            </ul>
        </div>
        <div style="text-align: center;">
            <button class="ep-btn ep-btn-start" onclick="epStartExam()">Start Exam</button>
            <button class="ep-btn ep-btn-close" onclick="epGoHome()">Not Now</button>
        </div>
    </div>

    <!-- 3. EXAM SCREEN -->
    <div id="ep-exam-screen" class="ep-screen">
        <div class="ep-timer-bar">
            <span>Live Exam</span>
            <span class="ep-timer-text">Time: <span id="ep-time">25:00</span></span>
        </div>
        
        <div class="ep-exam-layout">
            <div class="ep-left-panel">
                <div class="ep-toolbar">
                    <span style="font-weight: bold; font-size:14px;">Language:</span>
                    <select id="ep-lang" class="ep-lang-select" onchange="epChangeLang()">
                        <option value="en">English</option>
                        <option value="hi">हिन्दी (Hindi)</option>
                        <option value="or">ଓଡ଼ିଆ (Odia)</option>
                    </select>
                </div>
                
                <div class="ep-question-area" id="ep-q-area"></div>
                
                <!-- Bottom Left Submit Button -->
                <div class="ep-submit-wrapper" id="ep-submit-wrap" style="display:none;">
                    <button class="ep-btn ep-btn-start" onclick="epGoToPreview()">Submit Exam</button>
                </div>

                <div class="ep-controls">
                    <button class="ep-btn ep-btn-primary" id="ep-prev" onclick="epNav(-1)">← Prev</button>
                    <button class="ep-btn ep-btn-review" onclick="epMarkReview()">Hold/Review</button>
                    <button class="ep-btn ep-btn-primary" id="ep-next" onclick="epNav(1)">Next →</button>
                </div>
            </div>
            
            <div class="ep-right-panel">
                <h3 style="margin-top: 0; font-size: 16px;">Palette</h3>
                <div class="ep-palette-grid" id="ep-palette"></div>
            </div>
        </div>
    </div>

    <!-- 4. PREVIEW -->
    <div id="ep-preview-screen" class="ep-screen">
        <h2>Summary</h2>
        <div class="ep-preview-grid" id="ep-preview-grid"></div>
        <div style="display: flex; justify-content: space-between; flex-wrap:wrap; gap:10px;">
            <button class="ep-btn ep-btn-outline" onclick="epBackToExam()">← Recheck</button>
            <button class="ep-btn ep-btn-start" onclick="epFinalSubmit()">Final Submit →</button>
        </div>
    </div>

    <!-- 5. LOADER -->
    <div id="ep-loader-screen" class="ep-screen">
        <div class="ep-loader-container">
            <div class="ep-spinner"></div>
            <h3>Generating Results...</h3>
        </div>
    </div>

    <!-- 6. RESULT DASHBOARD -->
    <div id="ep-result-screen" class="ep-screen">
        <h2>Dashboard</h2>
        <div class="ep-dashboard-layout">
            <div class="ep-chart-container"><canvas id="ep-chart"></canvas></div>
            <div class="ep-score-details" id="ep-score-box"></div>
        </div>
        <div style="text-align:center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ccc;">
            <button class="ep-btn ep-btn-primary" onclick="epReExam()">↻ Re-Exam</button>
            <button class="ep-btn ep-btn-start" onclick="epGoHome()">+ New Exam</button>
        </div>
        <h3 style="margin-top: 30px;">Solutions</h3>
        <div id="ep-review-container"></div>
    </div>

    <script>
        // Check for refresh
        if (sessionStorage.getItem("epExamActive") === "true") {
            sessionStorage.removeItem("epExamActive");
            alert("Refresh detected. Exam session closed.");
        }

        // Q Bank Generator (20 Questions for demo)
        const epBank = [];
        for(let i=1; i<=10; i++) {
            epBank.push({
                type: "AR", ans: "A",
                en: { text: `<strong>Assertion (A):</strong> Lysosomes are suicide bags (Q${i}).<br><strong>Reason (R):</strong> They contain digestive enzymes.`, opts: [ {id:"A", t:"Both true, R explains A"}, {id:"B", t:"Both true, R doesn't explain A"}, {id:"C", t:"A true, R false"}, {id:"D", t:"A false, R true"} ]},
                hi: { text: `<strong>कथन (A):</strong> लाइसोसोम आत्महत्या की थैलियां हैं (Q${i})।<br><strong>कारण (R):</strong> उनमें पाचक एंजाइम होते हैं।`, opts: [ {id:"A", t:"दोनों सत्य हैं, R सही है"}, {id:"B", t:"दोनों सत्य हैं, R सही नहीं है"}, {id:"C", t:"A सत्य, R असत्य"}, {id:"D", t:"A असत्य, R सत्य"} ]},
                or: { text: `<strong>କଥନ (A):</strong> ଲାଇସୋସୋମକୁ ଆତ୍ମହତ୍ୟା ଥଳି କୁହାଯାଏ (Q${i}) |<br><strong>କାରଣ (R):</strong> ସେଥିରେ ହଜମକାରୀ ଏଞ୍ଜାଇମ୍ ଥାଏ |`, opts: [ {id:"A", t:"ଉଭୟ ସତ୍ୟ, R ସଠିକ୍"}, {id:"B", t:"ଉଭୟ ସତ୍ୟ, R ଭୁଲ"}, {id:"C", t:"A ସତ୍ୟ, R ମିଥ୍ୟା"}, {id:"D", t:"A ମିଥ୍ୟା, R ସତ୍ୟ"} ]}
            });
        }
        for(let i=11; i<=20; i++) {
            epBank.push({
                type: "MATCH", ans: "B",
                en: { text: `Match the following (Q${i}):<br><table class="ep-match-table"><tr><th>Col A</th><th>Col B</th></tr><tr><td>P. Mitochondria</td><td>1. Protein</td></tr><tr><td>Q. Ribosome</td><td>2. Energy</td></tr></table>`, opts: [ {id:"A", t:"P-1, Q-2"}, {id:"B", t:"P-2, Q-1"}, {id:"C", t:"P-1, Q-1"}, {id:"D", t:"P-2, Q-2"} ]},
                hi: { text: `मिलान करें (Q${i}):<br><table class="ep-match-table"><tr><th>कॉलम A</th><th>कॉलम B</th></tr><tr><td>P. माइटोकॉन्ड्रिया</td><td>1. प्रोटीन</td></tr><tr><td>Q. राइबोसोम</td><td>2. ऊर्जा</td></tr></table>`, opts: [ {id:"A", t:"P-1, Q-2"}, {id:"B", t:"P-2, Q-1"}, {id:"C", t:"P-1, Q-1"}, {id:"D", t:"P-2, Q-2"} ]},
                or: { text: `ମେଳ କରନ୍ତୁ (Q${i}):<br><table class="ep-match-table"><tr><th>ସ୍ତମ୍ଭ A</th><th>ସ୍ତମ୍ଭ B</th></tr><tr><td>P. ମାଇଟୋକଣ୍ଡ୍ରିଆ</td><td>1. ପ୍ରୋଟିନ୍</td></tr><tr><td>Q. ରାଇବୋସୋମ୍</td><td>2. ଶକ୍ତି</td></tr></table>`, opts: [ {id:"A", t:"P-1, Q-2"}, {id:"B", t:"P-2, Q-1"}, {id:"C", t:"P-1, Q-1"}, {id:"D", t:"P-2, Q-2"} ]}
            });
        }

        let epData = [], epState = [], epCurr = 0, epTimer, epTimeLeft, epLang = 'en', epTotal = 20;

        function epSwitch(id) {
            document.querySelectorAll('#blogger-exam-portal .ep-screen').forEach(s => s.classList.remove('ep-active'));
            document.getElementById(id).classList.add('ep-active');
        }

        function epGoHome() { sessionStorage.removeItem("epExamActive"); epSwitch('ep-home-screen'); }

        function epGoToInstructions() {
            document.getElementById('ep-disp-class').innerText = document.getElementById('ep-class').value + "th";
            document.getElementById('ep-disp-subject').innerText = document.getElementById('ep-subject').value;
            document.getElementById('ep-disp-chapter').innerText = document.getElementById('ep-chapter').value;
            epSwitch('ep-instruction-screen');
        }

        function epStartExam() {
            sessionStorage.setItem("epExamActive", "true");
            epData = [...epBank].sort(() => Math.random() - 0.5);
            epState = Array(epTotal).fill().map(() => ({ stat: 'unvisited', ans: null }));
            epCurr = 0; epTimeLeft = 25 * 60; epLang = 'en';
            document.getElementById('ep-lang').value = 'en';
            
            epSwitch('ep-exam-screen');
            epBuildPalette();
            epLoadQ(0);
            
            clearInterval(epTimer);
            epTimer = setInterval(() => {
                epTimeLeft--;
                let m = Math.floor(epTimeLeft / 60), s = epTimeLeft % 60;
                document.getElementById('ep-time').innerText = `${m}:${s<10?'0':''}${s}`;
                if (epTimeLeft <= 0) { clearInterval(epTimer); epFinalSubmit(); }
            }, 1000);
        }

        function epBuildPalette() {
            let p = document.getElementById('ep-palette'); p.innerHTML = '';
            for(let i=0; i<epTotal; i++) {
                p.innerHTML += `<button class="ep-palette-btn ep-status-unvisited" id="ep-pal-${i}" onclick="epLoadQ(${i})">${i+1}</button>`;
            }
        }

        function epUpdatePal() {
            for(let i=0; i<epTotal; i++) {
                let b = document.getElementById(`ep-pal-${i}`), s = epState[i];
                b.className = 'ep-palette-btn ' + (i===epCurr ? 'ep-status-current' : 
                    (s.stat==='review' ? 'ep-status-review' : 
                    (s.ans!==null ? 'ep-status-answered' : 
                    (s.stat==='visited' ? 'ep-status-visited' : 'ep-status-unvisited'))));
            }
        }

        function epChangeLang() { epLang = document.getElementById('ep-lang').value; epLoadQ(epCurr); }

        function epLoadQ(i) {
            epCurr = i; let q = epData[i], s = epState[i];
            if(s.stat === 'unvisited') s.stat = 'visited';
            
            let ld = q[epLang];
            document.getElementById('ep-q-area').innerHTML = `
                <div style="color:#666; font-size:12px; margin-bottom:10px;">${q.type === 'AR' ? 'Assertion/Reasoning' : 'Matching'}</div>
                <h3 style="text-align:left; margin-top:0;">Q${i+1}/${epTotal}</h3>
                <div style="margin-bottom:15px;">${ld.text}</div>
                <div class="ep-options">
                    ${ld.opts.map(o => `<label><input type="radio" name="epo" value="${o.id}" ${s.ans===o.id?'checked':''} onchange="epSetAns('${o.id}')"><strong>(${o.id})</strong> ${o.t}</label>`).join('')}
                </div>`;
            
            document.getElementById('ep-prev').style.visibility = i===0 ? 'hidden' : 'visible';
            
            if(i === epTotal-1) {
                document.getElementById('ep-next').style.display = 'none';
                document.getElementById('ep-submit-wrap').style.display = 'flex'; // Shows on bottom left
            } else {
                document.getElementById('ep-next').style.display = 'inline-block';
                document.getElementById('ep-submit-wrap').style.display = 'none';
            }
            epUpdatePal();
        }

        function epSetAns(v) { epState[epCurr].ans = v; epState[epCurr].stat = 'answered'; epUpdatePal(); }
        function epMarkReview() { epState[epCurr].stat = 'review'; epUpdatePal(); }
        function epNav(d) { if(epCurr+d >= 0 && epCurr+d < epTotal) epLoadQ(epCurr+d); }

        function epGoToPreview() {
            epSwitch('ep-preview-screen');
            let g = document.getElementById('ep-preview-grid'); g.innerHTML = '';
            epData.forEach((q,i) => {
                let s = epState[i];
                let col = s.ans ? 'var(--ep-success)' : (s.stat==='review'?'var(--ep-review)':'var(--ep-danger)');
                g.innerHTML += `<div class="ep-preview-item"><strong>Q${i+1}</strong><br><span style="color:${col}">${s.ans ? s.ans : (s.stat==='review'?'Rev':'Skip')}</span></div>`;
            });
        }

        function epBackToExam() { epSwitch('ep-exam-screen'); epLoadQ(epCurr); }

        function epFinalSubmit() {
            clearInterval(epTimer); sessionStorage.removeItem("epExamActive");
            epSwitch('ep-loader-screen');
            setTimeout(() => { epGenDash(); epSwitch('ep-result-screen'); }, 1500);
        }

        function epGenDash() {
            let c=0, w=0, u=0, rc = document.getElementById('ep-review-container'); rc.innerHTML = '';
            epData.forEach((q,i) => {
                let a = epState[i].ans;
                if(!a) { u++; } else if(a === q.ans) { c++; } else { w++; }
                
                let col = !a ? '#6c757d' : (a===q.ans ? 'var(--ep-success)' : 'var(--ep-danger)');
                let statTxt = !a ? 'Skipped' : (a===q.ans ? 'Correct' : `Wrong (Chose ${a})`);
                let en = q['en'], cOpt = en.opts.find(o => o.id === q.ans);
                
                rc.innerHTML += `<div class="ep-result-item"><div>${en.text}</div><div style="margin-top:10px; border-top:1px solid #eee; padding-top:10px;"><strong style="color:${col}">${statTxt}</strong> | <span style="color:var(--ep-success)">Ans: (${q.ans}) ${cOpt.t}</span></div></div>`;
            });

            document.getElementById('ep-score-box').innerHTML = `
                <div class="ep-score-box" style="background:#d4edda;color:#155724">Correct: ${c}</div>
                <div class="ep-score-box" style="background:#f8d7da;color:#721c24">Wrong: ${w}</div>
                <div class="ep-score-box" style="background:#e2e3e5;color:#383d41">Skipped: ${u}</div>
                <h3 style="margin-top:10px;">Score: ${(c/epTotal*100).toFixed(0)}%</h3>`;

            const ctx = document.getElementById('ep-chart').getContext('2d');
            if(window.epChartRef) window.epChartRef.destroy();
            window.epChartRef = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Correct','Wrong','Skipped'], datasets: [{ data: [c,w,u], backgroundColor: ['#28a745','#dc3545','#6c757d'] }]}
            });
        }
        function epReExam() { epSwitch('ep-instruction-screen'); }
    </script>
</div>
<!-- END EXAM PORTAL -->
